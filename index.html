<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hausanschreiben Agent V2</title>
</head>
<body>
  <h1>Hausanschreiben Agent V2</h1>

  <button onclick="getLocation()">Standort ermitteln</button>

  <p>Status: <span id="status">Bereit</span></p>

  <label>Straße</label><br>
  <input id="strasse"><br><br>

  <label>Hausnummer</label><br>
  <input id="hausnummer"><br><br>

  <label>PLZ</label><br>
  <input id="plz"><br><br>

  <label>Ort</label><br>
  <input id="ort"><br><br>

  <script>
    async function getLocation() {
      document.getElementById("status").textContent = "Standort wird ermittelt...";

      navigator.geolocation.getCurrentPosition(
        async function(position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          document.getElementById("status").textContent = "Adresse wird gesucht...";

          const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&addressdetails=1`;

          const response = await fetch(url);
          const data = await response.json();
          const address = data.address || {};

          document.getElementById("strasse").value =
            address.road || address.pedestrian || address.footway || "";

          document.getElementById("hausnummer").value =
            address.house_number || "";

          document.getElementById("plz").value =
            address.postcode || "";

          document.getElementById("ort").value =
            address.city || address.town || address.village || address.municipality || "";

          document.getElementById("status").textContent = "Adresse wurde vorbefüllt. Bitte prüfen.";
        },
        function(error) {
          document.getElementById("status").textContent = "Fehler: " + error.message;
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
