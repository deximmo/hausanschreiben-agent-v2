<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hausanschreiben Agent V2</title>

  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e3a8a;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --green: #16a34a;
      --red: #dc2626;
      --soft: #eff6ff;
      --manual: #fff7ed;
      --manual-border: #fdba74;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #38bdf8 0, transparent 32%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 7px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: 800;
      font-size: 14px;
    }

    input,
    select,
    button {
      width: 100%;
      border-radius: 16px;
      font-size: 16px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      background: white;
    }

    input:focus,
    select:focus {
      outline: 3px solid #bfdbfe;
      border-color: var(--primary);
    }

    button {
      border: none;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-location {
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: white;
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.35);
    }

    .btn-submit {
      margin-top: 20px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white;
      box-shadow: 0 12px 26px rgba(22, 163, 74, 0.30);
    }

    .status {
      margin-top: 16px;
      padding: 13px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-line;
    }

    .manual-box {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 16px;
      background: var(--manual);
      border: 1px solid var(--manual-border);
    }

    .manual-box label {
      margin-top: 0;
      color: #9a3412;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.45;
    }

    .required {
      color: var(--red);
    }

    .gps-small {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="badge">Hausanschreiben Agent · V2</div>

    <h1>Adresse erfassen</h1>
    <div class="subtitle">
      Standort abrufen, Adresse prüfen und das Anschreiben direkt auslösen.
    </div>

    <button class="btn-location" onclick="getLocation()">📍 Standort ermitteln</button>

    <div class="status" id="status">Bereit.</div>
    <div class="gps-small" id="gpsInfo"></div>

    <label for="strasse">Straße <span class="required">*</span></label>
    <select id="strasse" onchange="onStreetChange()">
      <option value="">Noch keine Straße ermittelt</option>
    </select>

    <div class="manual-box" id="manualStreetBox">
      <label for="manualStrasse">Straße manuell eingeben</label>
      <input id="manualStrasse" placeholder="z. B. Musterstraße" />
    </div>

    <label for="hausnummer">Hausnummer <span class="required">*</span></label>
    <select id="hausnummer" onchange="onHouseNumberChange()">
      <option value="">Noch keine Hausnummer ermittelt</option>
    </select>

    <div class="manual-box" id="manualHouseBox">
      <label for="manualHausnummer">Hausnummer manuell eingeben</label>
      <input id="manualHausnummer" placeholder="z. B. 12a" />
    </div>

    <div class="grid">
      <div>
        <label for="plz">PLZ <span class="required">*</span></label>
        <input id="plz" placeholder="39125" inputmode="numeric" />
      </div>

      <div>
        <label for="ort">Ort <span class="required">*</span></label>
        <input id="ort" placeholder="Magdeburg" />
      </div>
    </div>

    <button class="btn-submit" id="submitButton" onclick="submitForm()">Anschreiben absenden</button>

    <div class="hint">
      Notfall-Option: Wenn Straße oder Hausnummer nicht in der Liste stehen, wähle im Dropdown „Andere ... manuell eingeben“.
    </div>
  </main>

  <script>
    const MANUAL_STREET = "__manual_street__";
    const MANUAL_HOUSE = "__manual_house__";

    let currentLatitude = null;
    let currentLongitude = null;
    let currentAccuracy = null;

    let nearbyStreets = [];
    let nearbyHouseNumbers = [];

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function setGpsInfo() {
      if (!currentLatitude || !currentLongitude) return;

      document.getElementById("gpsInfo").textContent =
        "GPS: " +
        currentLatitude.toFixed(6) +
        ", " +
        currentLongitude.toFixed(6) +
        " · Genauigkeit ca. " +
        Math.round(currentAccuracy) +
        " m";
    }

    function fillSelect(selectId, values, placeholder, selectedValue, manualValue, manualLabel) {
      const select = document.getElementById(selectId);
      select.innerHTML = "";

      if (!values || values.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = placeholder;
        select.appendChild(option);
      } else {
        values.forEach(value => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;

          if (selectedValue && value === selectedValue) {
            option.selected = true;
          }

          select.appendChild(option);
        });
      }

      const manualOption = document.createElement("option");
      manualOption.value = manualValue;
      manualOption.textContent = manualLabel;
      select.appendChild(manualOption);
    }

    async function getLocation() {
      setStatus("Standort wird ermittelt...");

      if (!navigator.geolocation) {
        setStatus("Fehler: GPS wird von diesem Browser nicht unterstützt.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async function(position) {
          currentLatitude = position.coords.latitude;
          currentLongitude = position.coords.longitude;
          currentAccuracy = position.coords.accuracy;

          setGpsInfo();
          setStatus("Standort gefunden. Adresse und nahe Straßen werden gesucht...");

          await loadAddressData(currentLatitude, currentLongitude);
        },
        function(error) {
          setStatus("Fehler bei Standortermittlung: " + error.message);
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    async function loadAddressData(lat, lon) {
      try {
        const nearestAddress = await reverseGeocode(lat, lon);

        const nearestStreet =
          nearestAddress.road ||
          nearestAddress.pedestrian ||
          nearestAddress.footway ||
          nearestAddress.path ||
          "";

        const nearestHouseNumber = nearestAddress.house_number || "";

        document.getElementById("plz").value = nearestAddress.postcode || "";
        document.getElementById("ort").value =
          nearestAddress.city ||
          nearestAddress.town ||
          nearestAddress.village ||
          nearestAddress.municipality ||
          "";

        await loadNearbyObjects(lat, lon);

        let streetOptions = nearbyStreets.slice();

        if (nearestStreet && !streetOptions.includes(nearestStreet)) {
          streetOptions.unshift(nearestStreet);
        }

        fillSelect(
          "strasse",
          streetOptions,
          "Keine Straße gefunden",
          nearestStreet,
          MANUAL_STREET,
          "Andere Straße manuell eingeben"
        );

        let houseOptions = getHouseNumbersForStreet(nearestStreet);

        if (nearestHouseNumber && !houseOptions.includes(nearestHouseNumber)) {
          houseOptions.unshift(nearestHouseNumber);
        }

        fillSelect(
          "hausnummer",
          houseOptions,
          "Keine Hausnummer gefunden",
          nearestHouseNumber,
          MANUAL_HOUSE,
          "Andere Hausnummer manuell eingeben"
        );

        hideManualInputs();

        setStatus(
          "Adresse wurde vorbefüllt. Bitte prüfen.\n" +
          "Gefundene Straßen im Umkreis: " + streetOptions.length +
          "\nGefundene Hausnummern zur Straße: " + houseOptions.length
        );

      } catch (error) {
        setStatus("Adresse konnte nicht automatisch ermittelt werden. Bitte manuell eintragen.");
      }
    }

    async function reverseGeocode(lat, lon) {
      const url =
        "https://nominatim.openstreetmap.org/reverse?format=jsonv2" +
        "&lat=" + encodeURIComponent(lat) +
        "&lon=" + encodeURIComponent(lon) +
        "&addressdetails=1";

      const response = await fetch(url, {
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("Reverse Geocoding fehlgeschlagen.");
      }

      const data = await response.json();
      return data.address || {};
    }

    async function loadNearbyObjects(lat, lon) {
      nearbyStreets = [];
      nearbyHouseNumbers = [];

      const radius = 50;

      const query = `
        [out:json][timeout:25];
        (
          way(around:${radius},${lat},${lon})["highway"]["name"];
          node(around:${radius},${lat},${lon})["addr:housenumber"];
          way(around:${radius},${lat},${lon})["addr:housenumber"];
          relation(around:${radius},${lat},${lon})["addr:housenumber"];
        );
        out tags center;
      `;

      const response = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: query
      });

      if (!response.ok) {
        throw new Error("Umkreissuche fehlgeschlagen.");
      }

      const data = await response.json();

      const streetSet = new Set();
      const houseNumberList = [];

      for (const element of data.elements || []) {
        const tags = element.tags || {};

        if (tags.highway && tags.name) {
          streetSet.add(tags.name);
        }

        if (tags["addr:housenumber"]) {
          houseNumberList.push({
            number: tags["addr:housenumber"],
            street: tags["addr:street"] || "",
            lat: element.lat || element.center?.lat || null,
            lon: element.lon || element.center?.lon || null
          });
        }
      }

      nearbyStreets = Array.from(streetSet).sort((a, b) => a.localeCompare(b, "de"));

      nearbyHouseNumbers = houseNumberList
        .sort((a, b) => {
          const da = distanceMeters(currentLatitude, currentLongitude, a.lat, a.lon);
          const db = distanceMeters(currentLatitude, currentLongitude, b.lat, b.lon);
          return da - db;
        });
    }

    function getHouseNumbersForStreet(streetName) {
      let filtered = nearbyHouseNumbers;

      if (streetName) {
        filtered = nearbyHouseNumbers.filter(item =>
          !item.street || item.street === streetName
        );
      }

      const unique = [];

      for (const item of filtered) {
        if (item.number && !unique.includes(item.number)) {
          unique.push(item.number);
        }
      }

      return unique;
    }

    function onStreetChange() {
      const selectedStreet = document.getElementById("strasse").value;
      const manualStreetBox = document.getElementById("manualStreetBox");

      if (selectedStreet === MANUAL_STREET) {
        manualStreetBox.style.display = "block";
      } else {
        manualStreetBox.style.display = "none";

        const houseOptions = getHouseNumbersForStreet(selectedStreet);

        fillSelect(
          "hausnummer",
          houseOptions,
          "Keine Hausnummer gefunden",
          houseOptions[0] || "",
          MANUAL_HOUSE,
          "Andere Hausnummer manuell eingeben"
        );

        document.getElementById("manualHouseBox").style.display = "none";
      }
    }

    function onHouseNumberChange() {
      const selectedHouse = document.getElementById("hausnummer").value;
      const manualHouseBox = document.getElementById("manualHouseBox");

      if (selectedHouse === MANUAL_HOUSE) {
        manualHouseBox.style.display = "block";
      } else {
        manualHouseBox.style.display = "none";
      }
    }

    function hideManualInputs() {
      document.getElementById("manualStreetBox").style.display = "none";
      document.getElementById("manualHouseBox").style.display = "none";
      document.getElementById("manualStrasse").value = "";
      document.getElementById("manualHausnummer").value = "";
    }

    function getFinalStreet() {
      const selected = document.getElementById("strasse").value;

      if (selected === MANUAL_STREET) {
        return document.getElementById("manualStrasse").value.trim();
      }

      return selected.trim();
    }

    function getFinalHouseNumber() {
      const selected = document.getElementById("hausnummer").value;

      if (selected === MANUAL_HOUSE) {
        return document.getElementById("manualHausnummer").value.trim();
      }

      return selected.trim();
    }

    function distanceMeters(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;

      const R = 6371000;
      const toRad = value => value * Math.PI / 180;

      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }

    function submitForm() {
      const payload = {
        strasse: getFinalStreet(),
        hausnummer: getFinalHouseNumber(),
        plz: document.getElementById("plz").value.trim(),
        ort: document.getElementById("ort").value.trim(),
        gps_latitude: currentLatitude,
        gps_longitude: currentLongitude,
        gps_accuracy: currentAccuracy,
        source: "hausanschreiben-agent-v2-mobile-ui"
      };

      if (!payload.strasse || !payload.hausnummer || !payload.plz || !payload.ort) {
        setStatus("Bitte Straße, Hausnummer, PLZ und Ort vollständig ausfüllen.");
        return;
      }

      console.log("Formular-Payload:", payload);

      setStatus(
        "Formular wurde erfolgreich vorbereitet.\n" +
        "Nächster Schritt: Verbindung mit n8n Webhook."
      );

      clearAfterSubmit();
    }

    function clearAfterSubmit() {
      fillSelect(
        "strasse",
        [],
        "Noch keine Straße ermittelt",
        "",
        MANUAL_STREET,
        "Andere Straße manuell eingeben"
      );

      fillSelect(
        "hausnummer",
        [],
        "Noch keine Hausnummer ermittelt",
        "",
        MANUAL_HOUSE,
        "Andere Hausnummer manuell eingeben"
      );

      hideManualInputs();

      document.getElementById("plz").value = "";
      document.getElementById("ort").value = "";
      document.getElementById("gpsInfo").textContent = "";

      currentLatitude = null;
      currentLongitude = null;
      currentAccuracy = null;
      nearbyStreets = [];
      nearbyHouseNumbers = [];
    }
  </script>
</body>
</html>
